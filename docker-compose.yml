# Local services.
#   pnpm db:up     -> only Postgres (for normal dev with `pnpm dev`)
#   pnpm stack:up  -> Postgres + the production images of api and web (to test the Dockerfiles)
# Production on the VPS gets its own compose file later.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — 5433 on your machine, because a native Postgres already uses 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Named volume so data survives `docker compose down` (but not `down -v`).
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data like older versions).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app'] # only started when the "app" profile is asked for
    build:
      context: . # repo root, so the Dockerfile can see the workspace and packages/shared
      dockerfile: apps/api/Dockerfile
    image: barpos-api:dev
    init: true # tiny init process as PID 1: forwards signals and cleans up zombie processes
    environment:
      # Inside the compose network, the database's hostname is its service name: "db", on its internal port 5432.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: barpos-web:dev
    init: true
    environment:
      API_URL: http://api:3001 # server-to-server, over the compose network
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
